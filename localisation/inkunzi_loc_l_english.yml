l_english:
    UNITED_TEYPS: "United Teyps of Khidun'e"
    UNITED_TEYPS_ADJ: "United Teyps of Khidun'e"
    UNITED_TEYPS_PREFIX: "KSS"
    SADALAR_SINGULAR: "Khi-Sadal-kho"
    SADALAR_PLURAL: "Khi-Sadalar"
    SADALAR_ADJ: "$SADALAR_PLURAL$"
    SADALAR_BIO: "The Khi-Sadalar have, over the millenia of their existence fought wars and forged alliances, yet a single power has not emerged, perhaps due to the fact larger identities could not supplant clan bonds. In recent centuries however, the improvements of underwater travel technology have facilitated economic cooperation, and eventually a trade union of the Khi-Sadalar would form. This trade union would over decades grow in it's cooperation, especially in the field of research. Eventually, it ended up being the biggest contributor to the unification into an elective monarchic confederation/federation, the United Teyps of Khidun'e and the invention of space flight, which has for now culminated with the planting of our dark blue flag [image attached] on a small rocky planet of our system Tulgdun'e, although recent breakthroughs may bring us to the stars.\nHumanoid amphibians, similar to Witcher's drowners in appearance, but sentient and intelligent. "
    KHIDUNE: "Khidun'e"
    KHIDUNE_SYST: "Khidun'e's Light"
    UNITED_TEYPS_LEADER: "Shamil"
    UNITED_TEYPS_LEADER_TITLE: "Chancellor-King"
    UNITED_TEYPS_LEADER_BIO: "The first Chancellor-King to see the stars."
    